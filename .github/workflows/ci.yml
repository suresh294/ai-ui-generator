name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Report backend dependency audit findings
        continue-on-error: true
        run: |
          npm audit --prefix backend --json > /tmp/backend-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/backend-audit.json');
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            const via = item.via.map((entry) => typeof entry === 'string' ? entry : entry.title).join('; ');
            console.log(`${name}: ${item.severity}; fixAvailable=${JSON.stringify(item.fixAvailable)}; ${via}`);
          }
          NODE

      - name: Run backend smoke tests
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
